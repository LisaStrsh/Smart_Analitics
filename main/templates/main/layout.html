{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Analytics{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <aside>
        <img class="sidebar-logo"
            src="{% static 'main/img/logo_main.png' %}"
            alt="logo">
        <span class="logo"></span>
        <h3>Navigation</h3>
        <ul>
            <li><a href="{% url 'home' %}"><i class="fa-solid fa-house"></i>Home</a></li>
            <li><a href="{% url 'data' %}"><i class="fa-solid fa-database"></i>Data</a></li>
            <li><a href="{% url 'settings' %}"><i class="fa-solid fa-gear"></i>Settings</a></li>
            <li><a href="{% url 'about' %}"><i class="fa-solid fa-info"></i>About</a></li>
            <li><a href="{% url 'logout' %}"><i class="fa-solid fa-door-closed"></i>Log out</a></li>
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
