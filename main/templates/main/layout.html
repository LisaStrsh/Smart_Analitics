{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title%}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css'%}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <aside>
        <img class="sidebar-logo"
            src="{% static 'main/img/logo_main.png' %}"
            alt="logo">
        <span class="logo"></span>
        <h3>Navigation</h3>
        <ul>
            <li><a href="#"><i class="fa-solid fa-circle-user"></i>Profile</a></li>
            <li><a href="{% url 'home' %}"><i class="fa-solid fa-house"></i>Home</a></li>
            <li><a href="#"><i class="fa-brands fa-first-order-alt"></i>Orders</a></li>
            <li><a href="#"><i class="fa-solid fa-database"></i>Data</a></li>
            <li><a href="{% url 'about' %}"><i class="fa-solid fa-info"></i>About</a></li>
            <li><a href="{% url 'logout' %}"><i class="fa-solid fa-door-closed"></i>Log out</a></li>
        </ul>

    </aside>
    <main>
        {% block content%}
        {% endblock %}
    </main >



</body>
</html>
